<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>Greiner Brothers · Safety</title>
<link rel="stylesheet" href="office.css">
<script src="config.js"></script>
</head>
<body>

<!-- ============================ SIGN IN ============================ -->
<div class="gate" id="gate">
  <div class="gate-card">
    <img src="assets/greiner-logo.jpeg" alt="Greiner Brothers" style="height:54px;margin:0 auto 12px;display:block;border-radius:8px"
         onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
    <div class="mark" style="margin:0 auto;display:none">GB</div>
    <h2 id="gate-co">Greiner Brothers</h2>
    <p class="muted small" id="gate-by"></p>
    <input id="gate-in" type="password" inputmode="numeric" autocomplete="one-time-code"
           maxlength="10" placeholder="Access code" aria-label="Access code">
    <p class="err" id="gate-err" role="alert"></p>
    <button class="btn btn-gold" id="gate-go" style="width:100%;justify-content:center">Sign in</button>
    <p class="small muted" style="margin-top:1rem">Stays signed in on this computer for 30 days.</p>
  </div>
</div>

<!-- ============================== APP ============================== -->
<div class="app hide" id="app">
  <button class="side-reopen hide" id="side-reopen" type="button" title="Open menu" aria-label="Open menu">☰</button>
  <aside class="side">
    <div class="side-hd">
      <img src="assets/greiner-logo.jpeg" alt="Greiner Brothers" class="mark" style="object-fit:cover;padding:0"
           onerror="this.outerHTML='&lt;div class=\'mark\'&gt;GB&lt;/div&gt;'">
      <div style="min-width:0">
        <h1>Greiner Brothers</h1>
        <div class="co" id="side-co"></div>
      </div>
      <button class="side-toggle" id="side-toggle" type="button" title="Collapse menu" aria-label="Collapse menu">&lsaquo;&lsaquo;</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-ft">
      <div id="who"></div>
      <button id="refresh-data" type="button" style="display:block">&#8635; Refresh data</button>
      <button id="signout" type="button">Sign out</button>
      <div style="margin-top:.5rem"><a href="index.html" style="color:var(--gold);text-decoration:none;font-weight:600">Phone view &rarr;</a></div>
      <div class="demo-note">Powered by NextGen Safety</div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script src="office.js?v=2"></script>
</body>
</html>
